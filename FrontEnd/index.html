<body onload="init()">
  <nav>
    <ul class="top-nav" id="dropdownClick">
      <li><a id="home">Home</a></li>
      <li><a href="#refresh" onclick="location.reload()">Refresh</a></li>
      <li class="top-nav-right"><a href="javascript:void(0);" id="signOutBtn" onclick="logout()">Sign Out</a></li>
      <li class="top-nav-right"><a href="index.html" id="signInBtn">Sign In</a></li>
      <li class="dropdownIcon"><a href="javascript:void(0);" onclick="dropdownMenu()">&#9776;</a></li>
    </ul>
  </nav>
  
  <br>

  <div class="page-title">
    <h1>Game Servers</h1>
  </div>

  <table class="mcServerTable">
    <thead>
      <tr>
        <th></th>
        <th>DNS</th>
        <th>IP Address</th>
        <th>State</th>
        <th>Game</th>
        <th>Type</th>
        <th>Players</th>
        <th>Version</th>
        <th>Last Backup</th>
      </tr>
    </thead>
    <tbody id="mcServerTableBody">
      <tr class="mcLoadingRow"><td colspan="9">Loading...</td></tr>
    </tbody>

  <div class="alert" style="display:none;">
