  StateMachineDNS:
    Type: 'AWS::StepFunctions::StateMachine'
    Properties:
      Definition:
        Comment: Step machine to update DNS while minimising Lambda execution runtime
        StartAt: getIpUpdateDNS
        States:
          getIpUpdateDNS:
            Type: Task
            Resource: '${UpdateDns}'
            Retry:
              - ErrorEquals:
                  - noIpFound
                IntervalSeconds: 3
                MaxAttempts: 10
                BackoffRate: 1
              - ErrorEquals:
                  - States.TaskFailed
                IntervalSeconds: 30
                MaxAttempts: 2
                BackoffRate: 2
              - ErrorEquals:
                  - States.ALL
                IntervalSeconds: 5
                MaxAttempts: 5
                BackoffRate: 2
            End: true
      DefinitionSubstitutions:
        UpdateDns: !GetAtt UpdateDnsLambda.Arn
      RoleArn: !GetAtt StateMachineIamRole.Arn
      StateMachineName: !Sub ${AWS::StackName}-state-machine
      StateMachineType: STANDARD

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
          AllowAdminCreateUserOnly: True
      AutoVerifiedAttributes:
        - email
      DeviceConfiguration:
          ChallengeRequiredOnNewDevice: True
          DeviceOnlyRememberedOnUserPrompt: True
      Policies:
          PasswordPolicy:
              MinimumLength: 8
              RequireLowercase: True
              RequireNumbers: True
              RequireSymbols: True
              RequireUppercase: True
              TemporaryPasswordValidityDays: 3
      Schema:
        - Name: email
          Required: true
      UsernameAttributes:
        - email
      UsernameConfiguration:
          CaseSensitive: false

  CognitoAdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      UserPoolId: !Ref CognitoUserPool
      Description: Full access to every Control Panel action, for every game.

  CognitoUsersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: users
      UserPoolId: !Ref CognitoUserPool
      Description: >-
        Limited to Start/Stop and Download World, and only for games whose server-stack.yaml opted in via
        AllowUserLifecycle/AllowUserDownloads. See StartStopLambda's authorization check.

