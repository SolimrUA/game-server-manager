AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Personal Gaming Server Manager - shared control panel (Cognito login, control API, start/stop/DNS
  Lambdas, CloudFront web site). Deploy this stack once - it controls every EC2 game server tagged
  with IdTagName=IdTagValue, discovered purely at Lambda runtime via an EC2 tag filter, so it has no
  CloudFormation-level dependency on any Server stack. IdTagName/IdTagValue here must match the
  values entered on every Server stack you want this control panel to manage, and HostedZoneId here
  must match the HostedZoneId used on those Server stacks if you want DNS updates to work.

Metadata:
  'AWS::CloudFormation::Interface':
    ParameterGroups:
      - Label:
          default: AWS Configuration
        Parameters:
          - HostedZoneId
          - FrontEndDomain
          - IdTagValue
      - Label:
          default: You should not need to change anything in this section.
        Parameters:
          - IdTagName
    ParameterLabels:
      FrontEndDomain:
        default: Optional custom domain for the web control site (same Hosted Zone as above)
      HostedZoneId:
        default: Enter the ID of the Hosted Zone that contains your DNS records. Must match the HostedZoneId used on every Server stack.
      IdTagName:
        default: Tag name that will be used to identify your gaming server(s). Must match the value used on every Server stack.
      IdTagValue:
        default: Tag value that will be used to identify your gaming server(s). Must match the value used on every Server stack.

Parameters:
  FrontEndDomain:
    Description: Optional domain name for the web control site (e.g. game-servers.mydomain.link). Must be in the same Hosted Zone as configured below. Leave blank to only use the default CloudFront domain.
    Type: String
    Default: ''
  HostedZoneId:
    Description: Select the ID of your hosted zone - if there isn't one please go back to the section that describes setting up a domain name and hosted zone
    Type: 'AWS::Route53::HostedZone::Id'
    ConstraintDescription: >-
      Although optional, it's required if you are using a custom domain
      (recommended) so the DNS record for your domain can be updated
  IdTagName:
    Description: The name of the tag that will be used to identify your gaming server(s).  DO NOT CHANGE THIS VALUE
    AllowedPattern: game-server-finder
    Default: game-server-finder
    Type: String
    ConstraintDescription: Please set this to "game-server-finder" this is required so we can find your server(s) to control them
  IdTagValue:
    Description: The value of the tag that will be used to identify your gaming server(s). Must match the value used on every Server stack you want this control panel to manage.
    AllowedPattern: .+
    Type: String
    Default: game-server
    ConstraintDescription: This is a mandatory field - you must pust something in.  We recommend not changing the default value.

Conditions:
  FrontEndDomainIsSet: !Not
    - !Equals
      - !Ref FrontEndDomain
      - ''

Resources:
  ControlApi:
    Type: 'AWS::ApiGateway::RestApi'
    Properties:
      Description: "Primary API to control gaming server"
      Name: !Sub control-api-${AWS::StackName}
      EndpointConfiguration:
        Types:
          - REGIONAL
      FailOnWarnings: true

  CognitoAuthoriser:
    Type: 'AWS::ApiGateway::Authorizer'
    Properties:
      IdentitySource: method.request.header.Authorization
      Name: cognito-authoriser
      ProviderARNs:
        - !GetAtt CognitoUserPool.Arn
      RestApiId: !Ref ControlApi
      Type: COGNITO_USER_POOLS

  ControlApiDeployment:
    DependsOn: ApiGetInfoGetMethod
    Type: 'AWS::ApiGateway::Deployment'
    Properties:
      RestApiId: !Ref ControlApi
      Description: Deployment of gaming control REST API
      StageName: prod

  ControlApiResGetInfo:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      ParentId: !GetAtt
        - ControlApi
        - RootResourceId
      PathPart: getinfo
      RestApiId: !Ref ControlApi

  ControlApiResResize:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      ParentId: !GetAtt
        - ControlApi
        - RootResourceId
      PathPart: resize
      RestApiId: !Ref ControlApi

  ControlApiResStart:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      ParentId: !GetAtt
        - ControlApi
        - RootResourceId
      PathPart: start
      RestApiId: !Ref ControlApi

  ControlApiResStop:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      ParentId: !GetAtt
        - ControlApi
        - RootResourceId
      PathPart: stop
      RestApiId: !Ref ControlApi

  ApiGetInfoGetMethod:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      ApiKeyRequired: false
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthoriser
      HttpMethod: GET
      Integration:
          IntegrationHttpMethod: POST
          IntegrationResponses:
            - StatusCode: 200
              ResponseParameters:
                method.response.header.Access-Control-Allow-Origin : "'*'"
              ResponseTemplates:
                application/json : ''
          PassthroughBehavior: WHEN_NO_TEMPLATES
          RequestTemplates:
            application/json : "{\r\n \"command\": \"getInfo\",\r\n \"tagName\": \"$input.params('tagname')\",\r\n \"tagValue\": \"$input.params('tagvalue')\"\r\n}"
          TimeoutInMillis: 15000
          Type: AWS
          Uri: !Sub
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${lambdaArn}/invocations
            - lambdaArn: !GetAtt StartStopLambda.Arn
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json : 'Empty'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin : false
      OperationName: GetInfo
      RequestParameters:
        method.request.querystring.tagname : false
        method.request.querystring.tagvalue : false
      ResourceId: !Ref ControlApiResGetInfo
      RestApiId: !Ref ControlApi

  ApiGetInfoOptionsMethod:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      ApiKeyRequired: false
      AuthorizationType: NONE
      HttpMethod: OPTIONS
      Integration:
          IntegrationResponses:
            - StatusCode: 200
              ResponseParameters:
                method.response.header.Access-Control-Allow-Headers : "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
                method.response.header.Access-Control-Allow-Origin : "'*'"
                method.response.header.Access-Control-Allow-Credentials : "'true'"
                method.response.header.Access-Control-Allow-Methods : "'GET,OPTIONS'"
              ResponseTemplates:
                application/json : ''
          PassthroughBehavior: WHEN_NO_MATCH
          RequestTemplates:
            application/json : '{"statusCode": 200}'
          TimeoutInMillis: 15000
          Type: MOCK
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json : 'Empty'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers : false
            method.response.header.Access-Control-Allow-Origin : false
            method.response.header.Access-Control-Allow-Credentials : false
            method.response.header.Access-Control-Allow-Methods : false
      OperationName: GetInfoOPTIONS
      ResourceId: !Ref ControlApiResGetInfo
      RestApiId: !Ref ControlApi

  ApiStartGetMethod:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      ApiKeyRequired: false
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthoriser
      HttpMethod: GET
      Integration:
          IntegrationHttpMethod: POST
          IntegrationResponses:
            - StatusCode: 200
              ResponseParameters:
                method.response.header.Access-Control-Allow-Origin : "'*'"
              ResponseTemplates:
                application/json : ''
          PassthroughBehavior: WHEN_NO_TEMPLATES
          RequestTemplates:
            application/json : "{\r\n \"command\": \"start\",\r\n \"tagName\": \"$input.params('tagname')\",\r\n \"tagValue\": \"$input.params('tagvalue')\",\r\n \"instanceId\": \"$input.params('instanceid')\"\r\n}"
          TimeoutInMillis: 15000
          Type: AWS
          Uri: !Sub
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${lambdaArn}/invocations
            - lambdaArn: !GetAtt StartStopLambda.Arn
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json : 'Empty'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin : false
      OperationName: Start
      RequestParameters:
        method.request.querystring.tagname : false
        method.request.querystring.tagvalue : false
        method.request.querystring.instanceid : false
      ResourceId: !Ref ControlApiResStart
      RestApiId: !Ref ControlApi

  ApiStartOptionsMethod:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      ApiKeyRequired: false
      AuthorizationType: NONE
      HttpMethod: OPTIONS
      Integration:
          IntegrationResponses:
            - StatusCode: 200
              ResponseParameters:
                method.response.header.Access-Control-Allow-Headers : "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
                method.response.header.Access-Control-Allow-Origin : "'*'"
                method.response.header.Access-Control-Allow-Credentials : "'true'"
                method.response.header.Access-Control-Allow-Methods : "'GET,OPTIONS'"
              ResponseTemplates:
                application/json : ''
          PassthroughBehavior: WHEN_NO_MATCH
          RequestTemplates:
            application/json : '{"statusCode": 200}'
          TimeoutInMillis: 15000
          Type: MOCK
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json : 'Empty'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers : false
            method.response.header.Access-Control-Allow-Origin : false
            method.response.header.Access-Control-Allow-Credentials : false
            method.response.header.Access-Control-Allow-Methods : false
      OperationName: StartOPTIONS
      ResourceId: !Ref ControlApiResStart
      RestApiId: !Ref ControlApi

  ApiStopGetMethod:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      ApiKeyRequired: false
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthoriser
      HttpMethod: GET
      Integration:
          IntegrationHttpMethod: POST
          IntegrationResponses:
            - StatusCode: 200
              ResponseParameters:
                method.response.header.Access-Control-Allow-Origin : "'*'"
              ResponseTemplates:
                application/json : ''
          PassthroughBehavior: WHEN_NO_TEMPLATES
          RequestTemplates:
            application/json : "{\r\n \"command\": \"stop\",\r\n \"tagName\": \"$input.params('tagname')\",\r\n \"tagValue\": \"$input.params('tagvalue')\",\r\n \"instanceId\": \"$input.params('instanceid')\"\r\n}"
          TimeoutInMillis: 15000
          Type: AWS
          Uri: !Sub
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${lambdaArn}/invocations
            - lambdaArn: !GetAtt StartStopLambda.Arn
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json : 'Empty'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin : false
      OperationName: Stop
      RequestParameters:
        method.request.querystring.tagname : false
        method.request.querystring.tagvalue : false
        method.request.querystring.instanceid : false
      ResourceId: !Ref ControlApiResStop
      RestApiId: !Ref ControlApi

  ApiStopOptionsMethod:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      ApiKeyRequired: false
      AuthorizationType: NONE
      HttpMethod: OPTIONS
      Integration:
          IntegrationResponses:
            - StatusCode: 200
              ResponseParameters:
                method.response.header.Access-Control-Allow-Headers : "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
                method.response.header.Access-Control-Allow-Origin : "'*'"
                method.response.header.Access-Control-Allow-Credentials : "'true'"
                method.response.header.Access-Control-Allow-Methods : "'GET,OPTIONS'"
              ResponseTemplates:
                application/json : ''
          PassthroughBehavior: WHEN_NO_MATCH
          RequestTemplates:
            application/json : '{"statusCode": 200}'
          TimeoutInMillis: 15000
          Type: MOCK
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json : 'Empty'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers : false
            method.response.header.Access-Control-Allow-Origin : false
            method.response.header.Access-Control-Allow-Credentials : false
            method.response.header.Access-Control-Allow-Methods : false
      OperationName: StopOPTIONS
      ResourceId: !Ref ControlApiResStop
      RestApiId: !Ref ControlApi

  ApiResizeGetMethod:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      ApiKeyRequired: false
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthoriser
      HttpMethod: GET
      Integration:
          IntegrationHttpMethod: POST
          IntegrationResponses:
            - StatusCode: 200
              ResponseParameters:
                method.response.header.Access-Control-Allow-Origin : "'*'"
              ResponseTemplates:
                application/json : ''
          PassthroughBehavior: WHEN_NO_TEMPLATES
          RequestTemplates:
            application/json : "{\r\n \"command\": \"reSize\",\r\n \"tagName\": \"$input.params('tagname')\",\r\n \"tagValue\": \"$input.params('tagvalue')\",\r\n \"reSizeType\": \"$input.params('resize')\",\r\n \"instanceId\": \"$input.params('instanceid')\"\r\n}"
          TimeoutInMillis: 15000
          Type: AWS
          Uri: !Sub
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${lambdaArn}/invocations
            - lambdaArn: !GetAtt StartStopLambda.Arn
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json : 'Empty'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin : false
      OperationName: Resize
      RequestParameters:
        method.request.querystring.tagname : false
        method.request.querystring.tagvalue : false
        method.request.querystring.resize : false
        method.request.querystring.instanceid : false
      ResourceId: !Ref ControlApiResResize
      RestApiId: !Ref ControlApi

  ApiResizeOptionsMethod:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      ApiKeyRequired: false
      AuthorizationType: NONE
      HttpMethod: OPTIONS
      Integration:
          IntegrationResponses:
            - StatusCode: 200
              ResponseParameters:
                method.response.header.Access-Control-Allow-Headers : "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
                method.response.header.Access-Control-Allow-Origin : "'*'"
                method.response.header.Access-Control-Allow-Credentials : "'true'"
                method.response.header.Access-Control-Allow-Methods : "'GET,OPTIONS'"
              ResponseTemplates:
                application/json : ''
          PassthroughBehavior: WHEN_NO_MATCH
          RequestTemplates:
            application/json : '{"statusCode": 200}'
          TimeoutInMillis: 15000
          Type: MOCK
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json : 'Empty'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers : false
            method.response.header.Access-Control-Allow-Origin : false
            method.response.header.Access-Control-Allow-Credentials : false
            method.response.header.Access-Control-Allow-Methods : false
      OperationName: ResizeOPTIONS
      ResourceId: !Ref ControlApiResResize
      RestApiId: !Ref ControlApi

  StateMachineDNS:
    Type: 'AWS::StepFunctions::StateMachine'
    Properties:
      Definition:
        Comment: Step machine to update DNS while minimising Lambda execution runtime
        StartAt: getIpUpdateDNS
        States:
          getIpUpdateDNS:
            Type: Task
            Resource: '${UpdateDns}'
            Retry:
              - ErrorEquals:
                  - noIpFound
                IntervalSeconds: 3
                MaxAttempts: 10
                BackoffRate: 1
              - ErrorEquals:
                  - States.TaskFailed
                IntervalSeconds: 30
                MaxAttempts: 2
                BackoffRate: 2
              - ErrorEquals:
                  - States.ALL
                IntervalSeconds: 5
                MaxAttempts: 5
                BackoffRate: 2
            End: true
      DefinitionSubstitutions:
        UpdateDns: !GetAtt UpdateDnsLambda.Arn
      RoleArn: !GetAtt StateMachineIamRole.Arn
      StateMachineName: !Sub ${AWS::StackName}-state-machine
      StateMachineType: STANDARD

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
          AllowAdminCreateUserOnly: True
      AutoVerifiedAttributes:
        - email
      DeviceConfiguration:
          ChallengeRequiredOnNewDevice: True
          DeviceOnlyRememberedOnUserPrompt: True
      Policies:
          PasswordPolicy:
              MinimumLength: 8
              RequireLowercase: True
              RequireNumbers: True
              RequireSymbols: True
              RequireUppercase: True
              TemporaryPasswordValidityDays: 3
      Schema:
        - Name: email
          Required: true
      UsernameAttributes:
        - email
      UsernameConfiguration:
          CaseSensitive: false

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Join
        - ''
        - !Split
          - '.cloudfront.net'
          - !GetAtt CloudFront.DomainName
      UserPoolId: !Ref CognitoUserPool

  CognitoAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      AccessTokenValidity: 1
      IdTokenValidity: 1
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - aws.cognito.signin.user.admin
      CallbackURLs:
        - !If
          - FrontEndDomainIsSet
          - !Sub https://${FrontEndDomain}/signed_in.html
          - !Sub https://${CloudFront.DomainName}/signed_in.html
      DefaultRedirectURI: !If
        - FrontEndDomainIsSet
        - !Sub https://${FrontEndDomain}/signed_in.html
        - !Sub https://${CloudFront.DomainName}/signed_in.html
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_CUSTOM_AUTH
      GenerateSecret: false
      LogoutURLs:
        - !If
          - FrontEndDomainIsSet
          - !Sub https://${FrontEndDomain}/logout.html
          - !Sub https://${CloudFront.DomainName}/logout.html
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO
      UserPoolId: !Ref CognitoUserPool

  StateMachineIamRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: 'sts:AssumeRole'
      Description: State machine execution role
      Path: /service-role/
      Policies:
        - PolicyName: state-machine-inline
          PolicyDocument:
              Version: 2012-10-17
              Statement:
                - Effect: Allow
                  Action:
                    - 'lambda:InvokeFunction'
                  Resource:
                    - !GetAtt UpdateDnsLambda.Arn

  CustomResourceLambdaIamRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Description: Role for custom resource to allow lambda function to execute
      Path: /service-role/
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: 'arn:aws:logs:*:*:*'
              - Effect: Allow
                Action:
                  - 's3:ListBucket'
                Resource:
                  - !GetAtt LambdaSourceFilesS3.Arn
                  - !GetAtt S3Bucket.Arn
                  - !GetAtt LoggingBucket.Arn
              - Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                  - 's3:GetObject'
                Resource:
                  - !Sub
                    - ${bucket}/*
                    - bucket: !GetAtt LambdaSourceFilesS3.Arn
                  - !Sub
                    - ${bucket}/*
                    - bucket: !GetAtt S3Bucket.Arn
                  - !Sub
                    - ${bucket}/*
                    - bucket: !GetAtt LoggingBucket.Arn
          PolicyName: custom-resource-inline

  UpdateDnsLambdaIamRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Description: Execution role for StartStop Lambda function
      Path: /service-role/
      Policies:
        - PolicyName: update-dns-inline
          PolicyDocument:
            !Sub
              - |
                  {
                    "Version": "2012-10-17",
                    "Statement": [
                      {
                        "Effect": "Allow",
                        "Action":[
                          "logs:CreateLogGroup",
                          "logs:CreateLogStream",
                          "logs:PutLogEvents"
                          ],
                        "Resource": "*"
                      },
                      {
                        "Effect": "Allow",
                        "Action": "route53:ChangeResourceRecordSets",
                        "Resource": "arn:aws:route53:::hostedzone/${hostedZone}"
                      },
                      {
                        "Effect": "Allow",
                        "Action":[
                          "ec2:DescribeInstances",
                          "ec2:DescribeTags"
                          ],
                        "Resource": "*"
                      }
                    ]
                  }
              - hostedZone: !Ref HostedZoneId

  AcmCertLambdaIamRole:
    Type: 'AWS::IAM::Role'
    Condition: FrontEndDomainIsSet
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Description: Execution role for the ACM DNS-validated certificate custom resource
      Path: /service-role/
      Policies:
        - PolicyName: acm-cert-inline
          PolicyDocument:
            !Sub
              - |
                  {
                    "Version": "2012-10-17",
                    "Statement": [
                      {
                        "Effect": "Allow",
                        "Action": [
                          "logs:CreateLogGroup",
                          "logs:CreateLogStream",
                          "logs:PutLogEvents"
                        ],
                        "Resource": "*"
                      },
                      {
                        "Effect": "Allow",
                        "Action": [
                          "acm:RequestCertificate",
                          "acm:DescribeCertificate",
                          "acm:DeleteCertificate",
                          "acm:AddTagsToCertificate"
                        ],
                        "Resource": "*"
                      },
                      {
                        "Effect": "Allow",
                        "Action": "route53:ChangeResourceRecordSets",
                        "Resource": "arn:aws:route53:::hostedzone/${hostedZone}"
                      },
                      {
                        "Effect": "Allow",
                        "Action": "route53:GetChange",
                        "Resource": "*"
                      }
                    ]
                  }
              - hostedZone: !Ref HostedZoneId

  StartStopLambdaIamRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Description: Execution role for StartStop Lambda function
      Path: /service-role/
      Policies:
        - PolicyName: start-stop-inline
          PolicyDocument:
            !Sub
              - |
                  {
                    "Version": "2012-10-17",
                    "Statement": [
                        {
                        "Effect": "Allow",
                        "Action":[
                          "logs:CreateLogGroup",
                          "logs:CreateLogStream",
                          "logs:PutLogEvents"
                          ],
                        "Resource": "*"
                        },
                        {
                          "Effect": "Allow",
                          "Action": "states:StartExecution",
                          "Resource": "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-state-machine"
                        },
                        {
                        "Effect": "Allow",
                        "Action":[
                          "ec2:DescribeInstances",
                          "ec2:DescribeTags",
                          "ec2:DescribeInstanceTypes"
                          ],
                        "Resource": "*"
                        },
                        {
                        "Effect": "Allow",
                        "Action":[
                          "ec2:StartInstances",
                          "ec2:ModifyInstanceAttribute",
                          "ec2:StopInstances"
                          ],
                        "Resource": "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*",
                        "Condition": {
                          "StringEquals": {
                            "ec2:ResourceTag/${tagname}": "${tagvalue}"
                          }
                        }
                      }
                    ]
                  }
              - tagname: !Ref IdTagName
                tagvalue: !Ref IdTagValue

  CopyToS3Lambda:
    Type: 'AWS::Lambda::Function'
    Properties:
      Code:
        ZipFile: |
          import os
          import urllib.request
          from urllib.parse import urlparse
          import boto3
          import zipfile
          import cfnresponse
          def lambda_handler(event, context):
              s3 = boto3.resource('s3')
              properties = event['ResourceProperties']
              urls = properties['sourceUrls']
              bucket = properties['targetS3Bucket']
              if event['RequestType'] == 'Create':
                try:
                  for i in urls:
                    url = i.get('url')
                    urlPath = urlparse(url).path
                    fileName = os.path.basename(urlPath)
                    filePath = '/tmp/' + fileName
                    urllib.request.urlretrieve(url, filePath)
                    fileName = os.path.basename(filePath)
                    if i.get('zip'):
                      zipFileName = os.path.splitext(fileName)[0]+'.zip'
                      zipFilePath = '/tmp/' + zipFileName
                      arcName = i.get('filename')
                      zf = zipfile.ZipFile(zipFilePath, mode ='w')
                      zf.write(filePath, arcname=arcName)
                      zf.close()
                      fileName = zipFileName
                      filePath = zipFilePath
                    contentType = i.get('content-type')
                    if i.get('folder'):
                      fileName = i.get('folder')+ '/' + fileName
                    s3.Object(bucket, fileName).put(Body=open(filePath, 'rb'),ContentType=contentType)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Response': 'Success - files copied'})
                except Exception as e:
                  print(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Response': 'Failed to copy files'})
              if event['RequestType'] == 'Delete':
                try:
                  s3bucket = s3.Bucket(bucket)
                  s3bucket.objects.delete()
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Response': 'Success- bucket emptied'})
                except Exception as e:
                  print(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Response': 'Failed to empty bucket please clean up manually'})
              cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Response': 'Update action not Supported.'})
      Description: Custom resource lambda to copy required code files from github to S3
      Role: !GetAtt CustomResourceLambdaIamRole.Arn
      Handler: index.lambda_handler
      Runtime: python3.8
      Timeout: 10

  UpdateConfigLambda:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          def lambda_handler(event, context):
              s3 = boto3.client('s3')
              properties = event['ResourceProperties']
              configfile = properties['configfile']
              bucket = properties['S3Bucket']
              if event['RequestType'] == 'Create':
                  try:
                      with open('/tmp/configuration.js', 'wb') as f:
                          s3.download_fileobj(bucket, configfile, f)
                      f.close()
                      f = open('/tmp/configuration.js','rt')
                      configdata = f.read()
                      configdata = configdata.replace('REPLACE-WITH-CFURL', properties['cloudfrontURL'])
                      configdata = configdata.replace('REPLACE-WITH-COGNITO', properties['cognitoclientid'])
                      configdata = configdata.replace('REPLACE-WITH-COGDOMAIN', properties['cognitodomain'])
                      configdata = configdata.replace('REPLACE-WITH-APIURL', properties['apiurl'])
                      configdata = configdata.replace('REPLACE-WITH-IDTAGNAME', properties['idtagname'])
                      configdata = configdata.replace('REPLACE-WITH-IDTAGVALUE', properties['idtagvalue'])
                      configdata = configdata.replace('REPLACE-WITH-STACKNAME', properties['stackname'])
                      configdata = configdata.replace('REPLACE-WITH-POOLS-ID', properties['coguserpool'])
                      f.close()
                      f = open('/tmp/configuration.js','wt')
                      f.write(configdata)
                      f.close()
                      s3.put_object(Bucket=bucket,Key=configfile,Body=open('/tmp/configuration.js','rb'),ContentType="application/javascript")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Response': 'Updated config file.'})
                  except Exception as e:
                      print(e)
                      cfnresponse.send(event, context, cfnresponse.FAILED, {'Response': 'Failed to copy files'})
              cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Response': 'Update or Delete action not Supported.'})
      Description: Custom resource lambda to update config files on stack build complete
      Role: !GetAtt CustomResourceLambdaIamRole.Arn
      Handler: index.lambda_handler
      Runtime: python3.8
      Timeout: 10

  AcmCertificateLambda:
    Type: AWS::Lambda::Function
    Condition: FrontEndDomainIsSet
    Properties:
      Code:
        ZipFile: |
          import time
          import boto3
          import cfnresponse
          def lambda_handler(event, context):
              props = event['ResourceProperties']
              domain = props['DomainName']
              hostedZoneId = props['HostedZoneId']
              acm = boto3.client('acm', region_name='us-east-1')
              route53 = boto3.client('route53')
              physicalId = event.get('PhysicalResourceId', domain)
              try:
                  if event['RequestType'] == 'Delete':
                      if physicalId.startswith('arn:'):
                          try:
                              acm.delete_certificate(CertificateArn=physicalId)
                          except Exception as e:
                              print(e)
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physicalResourceId=physicalId)
                      return
                  if event['RequestType'] == 'Create':
                      response = acm.request_certificate(
                          DomainName=domain,
                          ValidationMethod='DNS',
                          Tags=[{'Key': 'Name', 'Value': domain}]
                      )
                      certArn = response['CertificateArn']

                      record = None
                      for attempt in range(10):
                          description = acm.describe_certificate(CertificateArn=certArn)
                          options = description['Certificate'].get('DomainValidationOptions', [])
                          if options and options[0].get('ResourceRecord'):
                              record = options[0]['ResourceRecord']
                              break
                          time.sleep(5)
                      if not record:
                          raise Exception('Timed out waiting for ACM to generate the DNS validation record')

                      route53.change_resource_record_sets(
                          HostedZoneId=hostedZoneId,
                          ChangeBatch={
                              'Changes': [{
                                  'Action': 'UPSERT',
                                  'ResourceRecordSet': {
                                      'Name': record['Name'],
                                      'Type': record['Type'],
                                      'TTL': 300,
                                      'ResourceRecords': [{'Value': record['Value']}]
                                  }
                              }]
                          }
                      )

                      waiter = acm.get_waiter('certificate_validated')
                      waiter.wait(CertificateArn=certArn, WaiterConfig={'Delay': 20, 'MaxAttempts': 40})

                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {'CertificateArn': certArn}, physicalResourceId=certArn)
                      return
                  # Update - domain names are immutable on this resource, nothing to do
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'CertificateArn': physicalId}, physicalResourceId=physicalId)
              except Exception as e:
                  print(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Response': str(e)}, physicalResourceId=physicalId)
      Description: Custom resource lambda to request and DNS-validate an ACM certificate for the front-end CloudFront distribution
      Role: !GetAtt AcmCertLambdaIamRole.Arn
      Handler: index.lambda_handler
      Runtime: python3.8
      Timeout: 900

