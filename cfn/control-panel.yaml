AWSTemplateFormatVersion: 2010-09-09
Description: Personal Gaming Server Manager - shared control panel (login, control API, web site).

Metadata:
  'AWS::CloudFormation::Interface':
    ParameterGroups:
      - Label:
          default: Published Assets (see CdkAssetPublisher in the root README)
        Parameters:
          - AssetsBucketName
          - AssetsKeyPrefix
          - StartStopLambdaKey
          - UpdateDnsLambdaKey
      - Label:
          default: AWS Configuration
        Parameters:
          - HostedZoneId
          - FrontEndDomain
          - IdTagValue
      - Label:
          default: You should not need to change anything in this section.
        Parameters:
          - IdTagName
    ParameterLabels:
      AssetsBucketName:
        default: S3 bucket your Lambda code and web site files were published to by CdkAssetPublisher
      AssetsKeyPrefix:
        default: Key prefix under that bucket the assets were published to (matches CdkAssetPublisher's ASSET_KEY_PREFIX)
      StartStopLambdaKey:
        default: CdkAssetPublisher's StartStopLambdaKey output - a content-hashed key that changes whenever this Lambda's code does, so this stack actually redeploys it
      UpdateDnsLambdaKey:
        default: CdkAssetPublisher's UpdateDnsLambdaKey output - same idea, for the DNS-update Lambda
      FrontEndDomain:
        default: Optional custom domain for the web control site (same Hosted Zone as above)
      HostedZoneId:
        default: Enter the ID of the Hosted Zone that contains your DNS records. Must match the HostedZoneId used on every Server stack.
      IdTagName:
        default: Tag name that will be used to identify your gaming server(s). Must match the value used on every Server stack.
      IdTagValue:
        default: Tag value that will be used to identify your gaming server(s). Must match the value used on every Server stack.

Parameters:
  AssetsBucketName:
    Description: >-
      S3 bucket holding your published Lambda code and web site files (CdkAssetPublisher's ASSET_BUCKET_NAME
      output). This stack never fetches from the public internet at deploy time - everything it needs must already
      be in this bucket.
    Type: String
    AllowedPattern: .+
    ConstraintDescription: Required - run CdkAssetPublisher first and pass its AssetBucketName output here.
  AssetsKeyPrefix:
    Description: >-
      Key prefix under AssetsBucketName the assets were published to (CdkAssetPublisher's ASSET_KEY_PREFIX, no
      leading or trailing slash, e.g. personal-game-server-manager/v1).
    Type: String
    AllowedPattern: .+
    ConstraintDescription: Required - must match the ASSET_KEY_PREFIX used when running CdkAssetPublisher.
  StartStopLambdaKey:
    Description: >-
      CdkAssetPublisher's StartStopLambdaKey output (e.g. Lambda/gaming_server_start_stop-v1_0.abc123.zip).
      Content-hashed so that a code change always produces a new value here, which is what actually makes this
      stack redeploy the Lambda - CloudFormation ignores S3 object content changes at an unchanged key/value.
    Type: String
    AllowedPattern: .+
    ConstraintDescription: Required - run CdkAssetPublisher first and pass its StartStopLambdaKey output here.
  UpdateDnsLambdaKey:
    Description: CdkAssetPublisher's UpdateDnsLambdaKey output - same content-hashing reasoning as StartStopLambdaKey.
    Type: String
    AllowedPattern: .+
    ConstraintDescription: Required - run CdkAssetPublisher first and pass its UpdateDnsLambdaKey output here.
  FrontEndDomain:
    Description: Optional domain name for the web control site (e.g. game-servers.mydomain.link). Must be in the same Hosted Zone as configured below. Leave blank to only use the default CloudFront domain.
    Type: String
    Default: ''
  HostedZoneId:
    Description: Select the ID of your hosted zone - if there isn't one please go back to the section that describes setting up a domain name and hosted zone
    Type: 'AWS::Route53::HostedZone::Id'
    ConstraintDescription: >-
      Although optional, it's required if you are using a custom domain
      (recommended) so the DNS record for your domain can be updated
  IdTagName:
    Description: The name of the tag that will be used to identify your gaming server(s).  DO NOT CHANGE THIS VALUE
    AllowedPattern: game-server-finder
    Default: game-server-finder
    Type: String
    ConstraintDescription: Please set this to "game-server-finder" this is required so we can find your server(s) to control them
  IdTagValue:
    Description: The value of the tag that will be used to identify your gaming server(s). Must match the value used on every Server stack you want this control panel to manage.
    AllowedPattern: .+
    Type: String
    Default: game-server
    ConstraintDescription: This is a mandatory field - you must pust something in.  We recommend not changing the default value.

Conditions:
  FrontEndDomainIsSet: !Not
    - !Equals
      - !Ref FrontEndDomain
      - ''

Resources:
  ControlApi:
    Type: 'AWS::ApiGateway::RestApi'
    Properties:
      Description: "Primary API to control gaming server"
      Name: !Sub control-api-${AWS::StackName}
      EndpointConfiguration:
        Types:
          - REGIONAL
      FailOnWarnings: true

  CognitoAuthoriser:
    Type: 'AWS::ApiGateway::Authorizer'
    Properties:
      IdentitySource: method.request.header.Authorization
      Name: cognito-authoriser
      ProviderARNs:
        - !GetAtt CognitoUserPool.Arn
      RestApiId: !Ref ControlApi
      Type: COGNITO_USER_POOLS

  #Confirmed live, twice: adding/changing methods or resources elsewhere in the API does NOT publish them
  #to the "prod" stage on its own - CloudFormation only republishes when this resource is actually
  #replaced (changing a property like Description isn't enough - it just patches the existing deployment's
  #metadata in place, still serving the stale snapshot). The reliable way to force a genuinely new
  #deployment is bumping THIS RESOURCE'S OWN LOGICAL ID (currently Rev6) - that makes CloudFormation create
  #a new resource rather than update the existing one. Next endpoint change: rename this to
  #ControlApiDeploymentRev7, and so on, AND add its GET method to DependsOn below.
  #
  #Second bug, found after the first "fix": DependsOn previously listed only ApiGetInfoGetMethod. With no
  #dependency on the OTHER GET methods, CloudFormation has no guarantee it finishes creating them before
  #snapshotting this deployment - for methods created in the very same update as a Deployment replacement,
  #that race is real (confirmed live: new endpoints 403'd with "Missing Authentication Token" - API
  #Gateway's way of saying the method genuinely isn't in the deployed snapshot - even though the resource
  #existed and OPTIONS on it worked). Depending on every GET method closes that race for good.
  #
  #Rev5: renamed the backup-trigger endpoint back from saveworld to backupnow (see git history) - a path
  #rename is exactly the kind of change that needs this bump, same as adding a new endpoint does; renaming
  #a DependsOn entry's VALUE alone does not make CloudFormation replace this resource on its own.
  #Rev6: added pauseidleshutdown/resumeidleshutdown.
  #Rev7: added the cognito:groups claim passthrough (two-tier admin/users access control) to every GET
  #method's RequestTemplates - no new endpoints, but changing an existing method's Integration still needs
  #this bump per the rule above.
  ControlApiDeploymentRev7:
    DependsOn:
      - ApiGetInfoGetMethod
      - ApiStartGetMethod
      - ApiStopGetMethod
      - ApiResizeGetMethod
      - ApiBackupNowGetMethod
      - ApiDownloadWorldStartGetMethod
      - ApiDownloadWorldStatusGetMethod
      - ApiPauseIdleShutdownGetMethod
      - ApiResumeIdleShutdownGetMethod
    Type: 'AWS::ApiGateway::Deployment'
    Properties:
      RestApiId: !Ref ControlApi
      Description: Deployment of gaming control REST API
      StageName: prod

  ControlApiResGetInfo:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      ParentId: !GetAtt
        - ControlApi
        - RootResourceId
      PathPart: getinfo
      RestApiId: !Ref ControlApi

  ControlApiResResize:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      ParentId: !GetAtt
        - ControlApi
        - RootResourceId
      PathPart: resize
      RestApiId: !Ref ControlApi

  ControlApiResStart:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      ParentId: !GetAtt
        - ControlApi
        - RootResourceId
      PathPart: start
      RestApiId: !Ref ControlApi

  ControlApiResStop:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      ParentId: !GetAtt
        - ControlApi
        - RootResourceId
      PathPart: stop
      RestApiId: !Ref ControlApi

  ControlApiResPauseIdleShutdown:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      ParentId: !GetAtt
        - ControlApi
        - RootResourceId
      PathPart: pauseidleshutdown
      RestApiId: !Ref ControlApi

  ControlApiResResumeIdleShutdown:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      ParentId: !GetAtt
        - ControlApi
        - RootResourceId
      PathPart: resumeidleshutdown
      RestApiId: !Ref ControlApi

  ControlApiResBackupNow:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      ParentId: !GetAtt
        - ControlApi
        - RootResourceId
      PathPart: backupnow
      RestApiId: !Ref ControlApi

  ControlApiResDownloadWorldStart:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      ParentId: !GetAtt
        - ControlApi
        - RootResourceId
      PathPart: downloadworldstart
      RestApiId: !Ref ControlApi

  ControlApiResDownloadWorldStatus:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      ParentId: !GetAtt
        - ControlApi
        - RootResourceId
      PathPart: downloadworldstatus
      RestApiId: !Ref ControlApi

  ApiGetInfoGetMethod:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      ApiKeyRequired: false
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthoriser
      HttpMethod: GET
      Integration:
          IntegrationHttpMethod: POST
          IntegrationResponses:
            - StatusCode: 200
              ResponseParameters:
                method.response.header.Access-Control-Allow-Origin : "'*'"
              ResponseTemplates:
                application/json : ''
          PassthroughBehavior: WHEN_NO_TEMPLATES
          RequestTemplates:
            application/json : "{\r\n \"command\": \"getInfo\",\r\n \"tagName\": \"$input.params('tagname')\",\r\n \"tagValue\": \"$input.params('tagvalue')\",\r\n \"groups\": \"$context.authorizer.claims.get('cognito:groups')\"\r\n}"
          TimeoutInMillis: 15000
          Type: AWS
          Uri: !Sub
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${lambdaArn}/invocations
            - lambdaArn: !GetAtt StartStopLambda.Arn
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json : 'Empty'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin : false
      OperationName: GetInfo
      RequestParameters:
        method.request.querystring.tagname : false
        method.request.querystring.tagvalue : false
      ResourceId: !Ref ControlApiResGetInfo
      RestApiId: !Ref ControlApi

