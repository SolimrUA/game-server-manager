  LambdaSourceFilesS3:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      PublicAccessBlockConfiguration:
          BlockPublicAcls: True
          BlockPublicPolicy: True
          IgnorePublicAcls: True
          RestrictPublicBuckets: True
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: s3-bucket-logs/

  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      PublicAccessBlockConfiguration:
          BlockPublicAcls: True
          BlockPublicPolicy: True
          IgnorePublicAcls: True
          RestrictPublicBuckets: True
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: s3-bucket-logs/

  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Statement:
          - Action:
              - 's3:GetObject'
            Effect: Allow
            Resource: !Sub
              - 'arn:aws:s3:::${S3Bucket}/*'
              - S3Bucket: !Ref S3Bucket
            Principal:
              AWS: !Sub
                - 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${OriginAccessiId}'
                - OriginAccessiId: !Ref OriginAccessId

  LoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: KMS-KEY-ARN
      AccessControl: LogDeliveryWrite
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  OriginAccessId:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: Origin Access ID for front end control site

  AcmCertificate:
    Type: Custom::AcmCertificate
    Condition: FrontEndDomainIsSet
    Properties:
      ServiceToken: !GetAtt AcmCertificateLambda.Arn
      DomainName: !Ref FrontEndDomain
      HostedZoneId: !Ref HostedZoneId

  CloudFront:
    Type: AWS::CloudFront::Distribution
    DependsOn: CopyFrontEndFiles
    Properties:
      DistributionConfig:
        Aliases: !If
          - FrontEndDomainIsSet
          - - !Ref FrontEndDomain
          - !Ref AWS::NoValue
        Comment: Gaming server control centre
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          TargetOriginId: CloudFrontS3OriginID
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: True
        HttpVersion: http2
        IPV6Enabled: true
        Logging:
          Bucket: !GetAtt LoggingBucket.DomainName
          IncludeCookies: True
          Prefix: cloudfront-logs/
        Origins:
            - DomainName: !Sub ${S3Bucket}.s3.${AWS::Region}.amazonaws.com
              Id: CloudFrontS3OriginID
              S3OriginConfig:
                OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${OriginAccessId}
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - FrontEndDomainIsSet
          - AcmCertificateArn: !GetAtt AcmCertificate.CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: True

  FrontEndRoute53Alias:
    Type: AWS::Route53::RecordSet
    Condition: FrontEndDomainIsSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref FrontEndDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFront.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: true

