  CopyToS3Lambda:
    Type: 'AWS::Lambda::Function'
    Properties:
      Code:
        ZipFile: |
          import os
          import urllib.request
          from urllib.parse import urlparse
          import boto3
          import cfnresponse
          def lambda_handler(event, context):
              s3 = boto3.resource('s3')
              properties = event['ResourceProperties']
              urls = properties['sourceUrls']
              bucket = properties['targetS3Bucket']
              if event['RequestType'] in ('Create', 'Update'):
                try:
                  for i in urls:
                    url = i.get('url')
                    urlPath = urlparse(url).path
                    fileName = os.path.basename(urlPath)
                    filePath = '/tmp/' + fileName
                    urllib.request.urlretrieve(url, filePath)
                    contentType = i.get('content-type')
                    if i.get('folder'):
                      fileName = i.get('folder')+ '/' + fileName
                    s3.Object(bucket, fileName).put(Body=open(filePath, 'rb'),ContentType=contentType)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Response': 'Success - files copied'})
                except Exception as e:
                  print(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Response': 'Failed to copy files'})
              if event['RequestType'] == 'Delete':
                try:
                  s3bucket = s3.Bucket(bucket)
                  s3bucket.objects.delete()
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Response': 'Success- bucket emptied'})
                except Exception as e:
                  print(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Response': 'Failed to empty bucket please clean up manually'})
              cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Response': 'Update action not Supported.'})
      Description: Custom resource lambda to copy required code files from github to S3
      Role: !GetAtt CustomResourceLambdaIamRole.Arn
      Handler: index.lambda_handler
      Runtime: python3.8
      Timeout: 10

  UpdateConfigLambda:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          def lambda_handler(event, context):
              s3 = boto3.client('s3')
              properties = event['ResourceProperties']
              configfile = properties['configfile']
              bucket = properties['S3Bucket']
              if event['RequestType'] in ('Create', 'Update'):
                  try:
                      with open('/tmp/configuration.js', 'wb') as f:
                          s3.download_fileobj(bucket, configfile, f)
                      with open('/tmp/configuration.js', 'rt') as f:
                          configdata = f.read()
                      configdata = configdata.replace('REPLACE-WITH-CFURL', properties['cloudfrontURL'])
                      configdata = configdata.replace('REPLACE-WITH-COGNITO', properties['cognitoclientid'])
                      configdata = configdata.replace('REPLACE-WITH-COGDOMAIN', properties['cognitodomain'])
                      configdata = configdata.replace('REPLACE-WITH-APIURL', properties['apiurl'])
                      configdata = configdata.replace('REPLACE-WITH-IDTAGNAME', properties['idtagname'])
                      configdata = configdata.replace('REPLACE-WITH-IDTAGVALUE', properties['idtagvalue'])
                      configdata = configdata.replace('REPLACE-WITH-STACKNAME', properties['stackname'])
                      configdata = configdata.replace('REPLACE-WITH-POOLS-ID', properties['coguserpool'])
                      with open('/tmp/configuration.js', 'wt') as f:
                          f.write(configdata)
                      s3.put_object(Bucket=bucket,Key=configfile,Body=open('/tmp/configuration.js','rb'),ContentType="application/javascript")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Response': 'Updated config file.'})
                  except Exception as e:
                      print(e)
                      cfnresponse.send(event, context, cfnresponse.FAILED, {'Response': 'Failed to copy files'})
              else:
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Response': 'Delete action not supported - nothing to do.'})
      Description: Custom resource lambda to update config files on stack build complete
      Role: !GetAtt CustomResourceLambdaIamRole.Arn
      Handler: index.lambda_handler
      Runtime: python3.8
      Timeout: 10

  AcmCertificateLambda:
    Type: AWS::Lambda::Function
    Condition: FrontEndDomainIsSet
    Properties:
      Code:
        ZipFile: |
          import time
          import boto3
          import cfnresponse
          def lambda_handler(event, context):
              props = event['ResourceProperties']
              domain = props['DomainName']
              hostedZoneId = props['HostedZoneId']
              acm = boto3.client('acm', region_name='us-east-1')
              route53 = boto3.client('route53')
              physicalId = event.get('PhysicalResourceId', domain)
              try:
                  if event['RequestType'] == 'Delete':
                      if physicalId.startswith('arn:'):
                          try:
                              acm.delete_certificate(CertificateArn=physicalId)
                          except Exception as e:
                              print(e)
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physicalResourceId=physicalId)
                      return
                  if event['RequestType'] == 'Create':
                      response = acm.request_certificate(
                          DomainName=domain,
                          ValidationMethod='DNS',
                          Tags=[{'Key': 'Name', 'Value': domain}]
                      )
                      certArn = response['CertificateArn']

                      record = None
                      for attempt in range(10):
                          description = acm.describe_certificate(CertificateArn=certArn)
                          options = description['Certificate'].get('DomainValidationOptions', [])
                          if options and options[0].get('ResourceRecord'):
                              record = options[0]['ResourceRecord']
                              break
                          time.sleep(5)
                      if not record:
                          raise Exception('Timed out waiting for ACM to generate the DNS validation record')

                      route53.change_resource_record_sets(
                          HostedZoneId=hostedZoneId,
                          ChangeBatch={
                              'Changes': [{
                                  'Action': 'UPSERT',
                                  'ResourceRecordSet': {
                                      'Name': record['Name'],
                                      'Type': record['Type'],
                                      'TTL': 300,
                                      'ResourceRecords': [{'Value': record['Value']}]
                                  }
                              }]
                          }
                      )

                      waiter = acm.get_waiter('certificate_validated')
                      waiter.wait(CertificateArn=certArn, WaiterConfig={'Delay': 20, 'MaxAttempts': 40})

                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {'CertificateArn': certArn}, physicalResourceId=certArn)
                      return
                  # Update - domain names are immutable on this resource, nothing to do
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'CertificateArn': physicalId}, physicalResourceId=physicalId)
              except Exception as e:
                  print(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Response': str(e)}, physicalResourceId=physicalId)
      Description: Custom resource lambda to request and DNS-validate an ACM certificate for the front-end CloudFront distribution
      Role: !GetAtt AcmCertLambdaIamRole.Arn
      Handler: index.lambda_handler
      Runtime: python3.8
      Timeout: 900

  StartStopLambda:
    Type: 'AWS::Lambda::Function'
    Properties:
      Code:
        S3Bucket: !Ref AssetsBucketName
        S3Key: !Sub ${AssetsKeyPrefix}/${StartStopLambdaKey}
      Description: Lambda function to control gaming server instances
      Environment:
        Variables:
          micro: t3a.micro
          small: t3a.small
          medium: t3a.medium
          large: t3a.large
          stepfunctionarn: !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-state-machine'
          statusBucket: !ImportValue common-infra-status-bucket-name
      Handler: lambda_function.lambda_handler
      MemorySize: 128
      PackageType: Zip
      Role: !GetAtt StartStopLambdaIamRole.Arn
      Runtime: python3.8
      Timeout: 10

  UpdateDnsLambda:
    Type: 'AWS::Lambda::Function'
    Properties:
      Code:
        S3Bucket: !Ref AssetsBucketName
        S3Key: !Sub ${AssetsKeyPrefix}/${UpdateDnsLambdaKey}
      Description: Lambda to update DNS
      Handler: lambda_function.lambda_handler
      MemorySize: 128
      PackageType: Zip
      Role: !GetAtt UpdateDnsLambdaIamRole.Arn
      Runtime: python3.8
      Timeout: 10

  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      PublicAccessBlockConfiguration:
          BlockPublicAcls: True
          BlockPublicPolicy: True
          IgnorePublicAcls: True
          RestrictPublicBuckets: True
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: s3-bucket-logs/

  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Statement:
          - Action:
              - 's3:GetObject'
            Effect: Allow
            Resource: !Sub
              - 'arn:aws:s3:::${S3Bucket}/*'
              - S3Bucket: !Ref S3Bucket
            Principal:
              AWS: !Sub
                - 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${OriginAccessiId}'
                - OriginAccessiId: !Ref OriginAccessId

  LoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: KMS-KEY-ARN
      AccessControl: LogDeliveryWrite
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  OriginAccessId:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: Origin Access ID for front end control site

  AcmCertificate:
    Type: Custom::AcmCertificate
    Condition: FrontEndDomainIsSet
    Properties:
      ServiceToken: !GetAtt AcmCertificateLambda.Arn
      DomainName: !Ref FrontEndDomain
      HostedZoneId: !Ref HostedZoneId

  CloudFront:
    Type: AWS::CloudFront::Distribution
    DependsOn: CopyFrontEndFiles
    Properties:
      DistributionConfig:
        Aliases: !If
          - FrontEndDomainIsSet
          - - !Ref FrontEndDomain
          - !Ref AWS::NoValue
        Comment: Gaming server control centre
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          TargetOriginId: CloudFrontS3OriginID
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: True
        HttpVersion: http2
        IPV6Enabled: true
        Logging:
          Bucket: !GetAtt LoggingBucket.DomainName
          IncludeCookies: True
          Prefix: cloudfront-logs/
        Origins:
            - DomainName: !Sub ${S3Bucket}.s3.${AWS::Region}.amazonaws.com
              Id: CloudFrontS3OriginID
              S3OriginConfig:
                OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${OriginAccessId}
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - FrontEndDomainIsSet
          - AcmCertificateArn: !GetAtt AcmCertificate.CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: True

  FrontEndRoute53Alias:
    Type: AWS::Route53::RecordSet
    Condition: FrontEndDomainIsSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref FrontEndDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFront.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: true

  StartStopLambdaPermissionGetInfo:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt StartStopLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ControlApi}/*/GET/getinfo

  StartStopLambdaPermissionStart:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt StartStopLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ControlApi}/*/GET/start

  StartStopLambdaPermissionStop:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt StartStopLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ControlApi}/*/GET/stop

  StartStopLambdaPermissionResize:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt StartStopLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ControlApi}/*/GET/resize

  StartStopLambdaPermissionBackupNow:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt StartStopLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ControlApi}/*/GET/backupnow

  StartStopLambdaPermissionPauseIdleShutdown:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt StartStopLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ControlApi}/*/GET/pauseidleshutdown

  StartStopLambdaPermissionResumeIdleShutdown:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt StartStopLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ControlApi}/*/GET/resumeidleshutdown

  StartStopLambdaPermissionDownloadWorldStart:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt StartStopLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ControlApi}/*/GET/downloadworldstart

  StartStopLambdaPermissionDownloadWorldStatus:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt StartStopLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ControlApi}/*/GET/downloadworldstatus

  CopyFrontEndFiles:
    Type: Custom::WebFileCopy
    Properties:
      ServiceToken: !GetAtt CopyToS3Lambda.Arn
      targetS3Bucket: !Ref S3Bucket
      sourceUrls:
        - url: !Sub https://${AssetsBucketName}.s3.${AWS::Region}.amazonaws.com/${AssetsKeyPrefix}/FrontEnd/styles.css
          content-type: text/css
        - url: !Sub https://${AssetsBucketName}.s3.${AWS::Region}.amazonaws.com/${AssetsKeyPrefix}/FrontEnd/index.html
          content-type: text/html
        - url: !Sub https://${AssetsBucketName}.s3.${AWS::Region}.amazonaws.com/${AssetsKeyPrefix}/FrontEnd/signed_in.html
          content-type: text/html
        - url: !Sub https://${AssetsBucketName}.s3.${AWS::Region}.amazonaws.com/${AssetsKeyPrefix}/FrontEnd/logout.html
          content-type: text/html
        - url: !Sub https://${AssetsBucketName}.s3.${AWS::Region}.amazonaws.com/${AssetsKeyPrefix}/FrontEnd/js/config.js
          content-type: application/javascript
          folder: js
        - url: !Sub https://${AssetsBucketName}.s3.${AWS::Region}.amazonaws.com/${AssetsKeyPrefix}/FrontEnd/js/index.js
          content-type: application/javascript
          folder: js

  UpdateConfig:
    Type: Custom::UpdateFileInS3
    Properties:
      ServiceToken: !GetAtt UpdateConfigLambda.Arn
      configfile: js/config.js
      S3Bucket: !Ref S3Bucket
      cloudfrontURL: !If
        - FrontEndDomainIsSet
        - !Sub https://${FrontEndDomain}
        - !Sub https://${CloudFront.DomainName}
      cognitoclientid: !Ref CognitoAppClient
      cognitodomain: !Sub ${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
      apiurl: !Sub https://${ControlApi}.execute-api.${AWS::Region}.amazonaws.com/prod/
      idtagname: !Ref IdTagName
      idtagvalue: !Ref IdTagValue
      stackname: !Ref AWS::StackName
      coguserpool: !Ref CognitoUserPool

Outputs:
  ControlApiUrl:
    Description: This is the URL for the API to control your gaming server instances
    Value: !Sub https://${ControlApi}.execute-api.${AWS::Region}.amazonaws.com/prod/

  CognitoUserPoolId:
    Description: Unique user pool ID for the people you want to be able to control your server
    Value: !Ref CognitoUserPool

  CloudfrontUrl:
    Description: The default CloudFront domain for your control website.
    Value: !Sub https://${CloudFront.DomainName}

  ControlWebsiteUrl:
    Description: The URL you should use to access your control website - your FrontEndDomain if you set one, otherwise the default CloudFront domain.
    Value: !If
      - FrontEndDomainIsSet
      - !Sub https://${FrontEndDomain}
      - !Sub https://${CloudFront.DomainName}

  S3Bucket:
    Description: The name of the created S3 bucket
    Value: !GetAtt S3Bucket.Arn

  TagName:
    Description: Tag name used.  This should not have been changed, and should be game-server-finder
    Value: !Ref IdTagName

  TagValue:
    Description: Tag value used to identify which servers this control panel manages. Must match the value entered on every Server stack.
    Value: !Ref IdTagValue

  CognitoDomainName:
    Description: The domain name for the Cognito hosted UI
    Value: !Sub ${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com

  CognitoClientID:
    Description: The clientID for the Cognito user pool
    Value: !Ref CognitoAppClient
