AWSTemplateFormatVersion: 2010-09-09
Description: Personal Gaming Server Manager - one game server instance and its dedicated resources.

Metadata:
  'AWS::CloudFormation::Interface':
    ParameterGroups:
      - Label:
          default: Personal Gaming Server Configuration
        Parameters:
          - GameName
          - GameServer
          - GameServerSha256
          - GameServerCompanionSha256
          - DataPath
          - WorldDownloadPaths
          - InstanceType
          - DiskSize
          - DiskType
          - DataVolumeSize
          - GamingTCPTrafficPortStart
          - GamingTCPTrafficPortEnd
          - GamingUDPTrafficPortStart
          - GamingUDPTrafficPortEnd
      - Label:
          default: AWS Configuration
        Parameters:
          - KeyName
          - HostedZoneId
          - Domain
          - IdTagValue
          - CreateInstance
          - AllowUserLifecycle
          - AllowUserDownloads
      - Label:
          default: You should not need to change anything in this section.
        Parameters:
          - IdTagName
          - LatestAMIIDx86
    ParameterLabels:
      GameName:
        default: Short lowercase name for this game, used to name resources (e.g. valheim, vintagestory)
      GameServer:
        default: Choose what game server you wish to install
      GameServerSha256:
        default: Expected SHA256 of the GameServer script, verified before it runs (see CdkAssetPublisher output)
      GameServerCompanionSha256:
        default: Expected SHA256 of GameServer's companion file, if it has one - leave blank otherwise
      DataPath:
        default: Absolute path where this game's world/mod data is mounted on the instance (e.g. /home/vintagestory/data)
      WorldDownloadPaths:
        default: Comma-separated subfolders of DataPath to include in "Download World" zips (e.g. Saves,Mods,Playerdata)
      InstanceType:
        default: Select the server size (we recommend selecting a larger instance for initial install and then changing this to a smaller size later).
      DiskSize:
        default: How many Gibibytes would you like?
      DiskType:
        default: What do you want your hard-drive made from (GP3 is recommended)?
      DataVolumeSize:
        default: How many Gibibytes for your persistent world/mod data volume? Never lower this once set.
      CreateInstance:
        default: Leave as true. Toggle to false then back to true to force a fresh instance without losing your data volume.
      AllowUserLifecycle:
        default: Let non-admin Control Panel users Start/Stop this game's server? (admins can always do this)
      AllowUserDownloads:
        default: Let non-admin Control Panel users Download World for this game's server? (admins can always do this)
      KeyName:
        default: Select the key pair you will use to access server OS
      Domain:
        default: Enter the domain name you will use.  Note this should be controlled by the Hosted Zone above (see setup instructions earlier)
      HostedZoneId:
        default: Enter the ID of the Hosted Zone that contains your DNS records. Must match the HostedZoneId used on your Control Panel stack.
      IdTagName:
        default: Tag name that will be used to identify your gaming server(s). Must match the value used on your Control Panel stack.
      IdTagValue:
        default: Tag value that will be used to identify your gaming server(s). Must match the value used on your Control Panel stack.
      LatestAMIIDx86:
        default: The AMI to use. This is the machine image and includes at a minimum the OS for the server
      GamingTCPTrafficPortStart:
        default: Start of the port range that should be accessible from the internet for TCP traffic.  Leave blank if you only want to allow UDP traffic to your server.
      GamingTCPTrafficPortEnd:
        default: End of the port range that should be accessible from the internet for TCP traffic.
      GamingUDPTrafficPortStart:
        default: Start of the port range that should be accessible from the internet for UDP traffic.  Leave blank if you only want to allow TCP traffic to your server.
      GamingUDPTrafficPortEnd:
        default: End of the port range that should be accessible from the internet for UDP traffic.

Parameters:
  GameName:
    Description: Short lowercase name for this game, used to name resources - e.g. valheim, vintagestory.
    Type: String
    AllowedPattern: '[a-z0-9-]+'
    ConstraintDescription: Lowercase letters, numbers, and hyphens only.
    Default: valheim
  GameServer:
    Description: >-
      URL for the shell script to install the game server of your choice - we call this the game cartridge URL.
      Must be an uncompressed shell script to run on the selected AMI (Ubuntu by default). Point this at your own
      published S3 copy (see CdkAssetPublisher in the root README) - there is no default, since this instance
      downloads and runs whatever is at this URL on first boot, and defaulting to a script fetched from the public
      internet at deploy time is exactly what this project avoids.
    Type: String
    AllowedPattern: https?:\/\/(www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%_\+.~#?&//=]*)
    ConstraintDescription: 'Must be a valid URL.'
  KeyName:
    Description: >-
      This is required so you can access the server.  If there is no option to
      select one, please go back and create one before trying to run this
      template again
    AllowedPattern: .+
    ConstraintDescription: >-
      You must choose a keypair otherwise you won't be able to login to your
      server's OS
    Type: 'AWS::EC2::KeyPair::KeyName'
  DiskSize:
    Description: >-
      Size of disk - you must choose a disk size of at least 8GiB (because this
      is the size of the Linux AMI)
    AllowedPattern: '^([8-9]|([1-9]\d{1,}))$'
    ConstraintDescription: You must choose a disk size of at least 8 GiB
    Default: '8'
    Type: String
  DiskType:
    Description: Choose disk type.  GP3 is recommended
    AllowedPattern: .+
    AllowedValues:
      - gp3
      - gp2
      - standard
      - IO2
    Default: gp3
    ConstraintDescription: You must choose a disk type
    Type: String
  DataVolumeSize:
    Description: >-
      Size in GiB of the persistent volume that holds this server's world/mod data. This volume is
      independent of the instance - it survives instance replacement, so redeploying this stack never
      loses your world. Never lower this once set: shrinking forces the volume itself to be replaced, and
      although this template retains the old volume as a safety net (rather than deleting it), a shrink
      attempt will still fail confusingly.
    AllowedPattern: '^([8-9]|([1-9]\d{1,}))$'
    ConstraintDescription: You must choose a data volume size of at least 8 GiB.
    Default: '10'
    Type: String
  CreateInstance:
    Description: >-
      Leave as true for normal use. Set to false, deploy, then back to true and deploy again to force a
      fresh instance (e.g. to pick up an updated GameServer script) without deleting this whole stack -
      the persistent data volume and everything else stays intact throughout, only the compute is replaced.
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Type: String
  AllowUserLifecycle:
    Description: >-
      Whether non-admin ("users" group) Cognito accounts may Start/Stop this specific game's server from
      the Control Panel. Admins can always do this regardless of this setting.
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Type: String
  AllowUserDownloads:
    Description: >-
      Whether non-admin ("users" group) Cognito accounts may Download World for this specific game's
      server from the Control Panel. Admins can always do this regardless of this setting.
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Type: String
  GameServerSha256:
    Description: >-
      Expected SHA256 of the GameServer script's content (CdkAssetPublisher's ValheimSha256 /
      VintageStoryInstallSha256 output), verified before the script is ever executed. This is what stops a
      compromised asset bucket from getting arbitrary code run here - only a script matching the hash you
      approved at deploy time will run, regardless of what the bucket holds later.
    AllowedPattern: '^[a-f0-9]{64}$'
    ConstraintDescription: Must be a 64-character lowercase hex SHA256 digest.
    Type: String
  GameServerCompanionSha256:
    Description: >-
      Expected SHA256 of a companion file GameServer's script fetches for itself (e.g. Vintage Story's
      status_agent.py, CdkAssetPublisher's VintageStoryStatusAgentSha256 output). Leave blank for a game
      whose script has no companion file to verify.
    AllowedPattern: '^([a-f0-9]{64})?$'
    ConstraintDescription: Must be blank or a 64-character lowercase hex SHA256 digest.
    Default: ''
    Type: String
  DataPath:
    Description: >-
      Absolute path on the instance where this game's world/mod data is mounted (e.g.
      /home/vintagestory/data for Vintage Story, /usr/games/serverconfig/valheim for Valheim). Tagged onto
      the instance so the Control Panel's "Download World" feature can zip the right directory without
      hardcoding a per-game path table.
    AllowedPattern: '^/.+$'
    ConstraintDescription: Must be an absolute path.
    Type: String
  WorldDownloadPaths:
    Description: >-
      Comma-separated list of paths, relative to DataPath, that "Download World" actually includes in the
      zip (e.g. "Saves,Mods,Playerdata" for Vintage Story) - everything else in DataPath is left out,
      deliberately, since it can hold things with no business in a downloadable file (Vintage Story's
      serverconfig.json has a Password field in it).
    AllowedPattern: '^[^,]+(,[^,]+)*$'
    ConstraintDescription: Must be a comma-separated list of relative paths.
    Type: String
  InstanceType:
    Description: 'Select the AWS EC2 instance type you want.  You can change avaialble options later via the AWS Console - see blog entry for more details'
    AllowedPattern: .+
    ConstraintDescription: You must choose a server size
    Type: String
    AllowedValues:
      - t3a.micro
      - t3a.small
      - t3a.medium
      - t3a.large
      - t3a.xlarge
      - t3a.2xlarge
  LatestAMIIDx86:
    Description: Defaults to the latest Ubuntu AMI ID.  You can replace this if you would like to use a different AMI / Operating System.
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  GamingTCPTrafficPortStart:
    Description: Enter port number for your server ingress security group.  This will open your gaming server to TCP traffic to a range of ports with this as the lower boundary.
    Type: String
    AllowedPattern: ^(^$|[0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$
    ConstraintDescription: Must be a valid port number.
  GamingTCPTrafficPortEnd:
    Description: Enter port number for your server ingress security group.  This will open your gaming server to TCP traffic to a range of ports with this as the upper boundary.
    Type: String
    AllowedPattern: ^(^$|[0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$
    ConstraintDescription: Must be a valid port number.
  GamingUDPTrafficPortStart:
    Description: Enter port number for your server ingress security group.  This will open your gaming server to UDP traffic to a range of ports with this as the lower boundary.
    Type: String
    AllowedPattern: ^(^$|[0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$
    ConstraintDescription: Must be a valid port number.
    Default: '2456'
  GamingUDPTrafficPortEnd:
    Description: Enter port number for your server ingress security group.  This will open your gaming server to UDP traffic to a range of ports with this as the upper boundary.
    Type: String
    AllowedPattern: ^(^$|[0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$
    ConstraintDescription: Must be a valid port number.
    Default: '2458'
  Domain:
    Description: Domain name you will use to access your server (e.g. mygameserver.link).  This is optional however without it you will need to configure a new IP address each stop/start
    Type: String
  HostedZoneId:
    Description: Select the ID of your hosted zone - if there isn't one please go back to the section that describes setting up a domain name and hosted zone
    Type: 'AWS::Route53::HostedZone::Id'
    ConstraintDescription: >-
      Although optional, it's required if you are using a custom domain
      (recommended) so the DNS record for your domain can be updated
  IdTagName:
    Description: The name of the tag that will be used to identify your gaming server(s).  DO NOT CHANGE THIS VALUE
    AllowedPattern: game-server-finder
    Default: game-server-finder
    Type: String
    ConstraintDescription: Please set this to "game-server-finder" this is required so we can find your server(s) to control them
  IdTagValue:
    Description: The value of the tag that will be used to identify your gaming server(s).  This can be useful if you want to control different servers independently - such as if you wanted to spin up a server to test out some features or mods without risking your main server - in this case you may want to change the tag value to something like dev or test for example.
    AllowedPattern: .+
    Type: String
    Default: game-server
    ConstraintDescription: This is a mandatory field - you must pust something in.  We recommend not changing the default value.
Conditions:
  noSecIngress: !And
    - !Condition hasTCP
    - !Condition hasUDP
  hasTCP: !Not
    - !Equals
      - !Ref GamingTCPTrafficPortStart
      - ''
  hasUDP: !Not
    - !Equals
      - !Ref GamingUDPTrafficPortStart
      - ''
  CreateInstance: !Equals
    - !Ref CreateInstance
    - 'true'

Resources:
  EC2Instance:
    Type: 'AWS::EC2::Instance'
    Condition: CreateInstance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT30M
    Properties:
      SecurityGroupIds:
        - !Ref SecurityGroup
      InstanceType: !Ref InstanceType
      CreditSpecification:
        CPUCredits: Standard
      SubnetId: !ImportValue common-infra-subnet-id
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !Ref KeyName
      Tags:
        - Key: Name
          Value: !Sub game-server-${GameName}-ec2
        - Key: !Ref IdTagName
          Value: !Ref IdTagValue
        - Key: domain
          Value: !Ref Domain
        - Key: hostedZoneId
          Value: !Ref HostedZoneId
        - Key: game-name
          Value: !Ref GameName
        - Key: data-path
          Value: !Ref DataPath
        - Key: world-download-paths
          Value: !Ref WorldDownloadPaths
        - Key: user-lifecycle-allowed
          Value: !Ref AllowUserLifecycle
        - Key: user-downloads-allowed
          Value: !Ref AllowUserDownloads
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: 'true'
            Encrypted: 'false'
            VolumeSize: !Ref DiskSize
            VolumeType: !Ref DiskType
      ImageId: !Ref LatestAMIIDx86
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash -xe
            export DEBIAN_FRONTEND=noninteractive
            apt update
            apt upgrade -y
            apt install -y python3-pip
            pip3 install --break-system-packages https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz
            trap 'cfn-signal -e $? --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region}' EXIT
            #on the root disk, not /tmp: /tmp is cleared on every reboot (this AMI mounts it as tmpfs), but
            #status_agent.py re-reads these two values every time it (re)starts, including after every
            #stop/start cycle - and this instance always goes through at least one, since it auto-shuts-down
            #~2 minutes after install and gets started again from the Control Panel.
            mkdir -p /etc/game-server-manager
            echo ${AWS::StackName} > /etc/game-server-manager/paramName.txt
            echo ${StatusBucket} > /etc/game-server-manager/statusBucket.txt
            echo ${GameName} > /etc/game-server-manager/statusKey.txt
            echo ${DataVolumeId} > /etc/game-server-manager/dataVolumeId.txt
            echo "${GameServerCompanionSha256}" > /etc/game-server-manager/companionSha256.txt
            mkdir -p /usr/games/install
            cd /usr/games/install
            wget -O gameserverinstall.sh ${GameServer}
            echo "${GameServerSha256}  gameserverinstall.sh" | sha256sum -c -
            chmod +x gameserverinstall.sh
            ./gameserverinstall.sh "${GameServer}"
          - GameServer: !Ref GameServer
            StatusBucket: !ImportValue common-infra-status-bucket-name
            DataVolumeId: !Ref GameDataVolume
            GameServerSha256: !Ref GameServerSha256
            GameServerCompanionSha256: !Ref GameServerCompanionSha256

  GameDataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !ImportValue common-infra-subnet-az
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub game-server-${GameName}-data
        - Key: !Ref IdTagName
          Value: !Ref IdTagValue
        - Key: game-name
          Value: !Ref GameName

  GameDataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Condition: CreateInstance
    Properties:
      InstanceId: !Ref EC2Instance
      VolumeId: !Ref GameDataVolume
      Device: /dev/sdf

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /service-role/
      Roles:
        - !Ref GamingServerIamRole

  GamingServerIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      Description: IAM role to allow gaming EC2 server to read/write its own join-password parameter
      Path: /service-role/
      Policies:
        - PolicyName: personal-gaming-server-role
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ssm:GetParameter"
                  - "ssm:PutParameter"
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/game-password-${AWS::StackName}
              - Effect: Allow
                Action: "s3:PutObject"
                Resource: !Sub
                  - arn:aws:s3:::${bucket}/status/${GameName}.json
                  - bucket: !ImportValue common-infra-status-bucket-name
              - Effect: Allow
                #destination for the "Download World" feature's zip upload (see cfn/control-panel.yaml) -
                #same shared status bucket, a separate prefix
                Action: "s3:PutObject"
                Resource: !Sub
                  - arn:aws:s3:::${bucket}/worlds/${GameName}/*
                  - bucket: !ImportValue common-infra-status-bucket-name
      #lets AWS Systems Manager Run Command reach and execute on this instance (control/data channels +
      #ssm:UpdateInstanceInformation) - the standard AWS-maintained policy for any SSM-managed instance,
      #used by the Control Panel's "Download Backup" feature to zip the live data directory on request.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BackupIamRole:
    Type: 'AWS::IAM::Role'
    Properties:
      #Deterministic name (not CFN-generated) so the Control Panel's Lambda - in a different stack, with
      #no way to !GetAtt this role - can construct its ARN from just the game name, to pass as
      #backup:StartBackupJob's IamRoleArn for the "Backup Now" button. (Tried tag-based lookup via the
      #Resource Groups Tagging API first - confirmed live that API simply doesn't index IAM roles at all
      #in this account, empty results even with no tag filter - so a deterministic name is the only
      #option.) This forces a one-time IAM role replacement here, which cascades into replacing
      #TagBasedBackupSelection below (its IamRoleArn references this role) - see the SelectionName comment
      #there for why that needs a one-time rename too.
      RoleName: !Sub "${AWS::StackName}-backup-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: 'sts:AssumeRole'
      Description: Role for custom resource to allow lambda function to execute
      Path: /service-role/
      Policies:
        - PolicyName: BackupInline
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:DeleteSnapshot
                Resource:
                  - arn:aws:ec2:*::snapshot/*
                  - arn:aws:ec2:*:*:volume/*
              - Effect: Allow
                Action:
                  - ec2:CreateImage
                  - ec2:DeregisterImage
                  #restoring an EBS-type recovery point creates a brand new volume from its snapshot -
                  #CreateVolume can't be scoped to a specific ARN since the volume doesn't exist yet.
                  - ec2:CreateVolume
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:CopyImage
                  - ec2:CopySnapshot
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:CreateTags
                Resource: arn:aws:ec2:*:*:image/*
              - Effect: Allow
                Action:
                  - ec2:DescribeSnapshots
                  - ec2:DescribeTags
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceAttribute
                  - ec2:DescribeInstanceCreditSpecifications
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeElasticGpus
                  - ec2:DescribeSpotInstanceRequests
                  #EC2 Describe* actions don't support resource-level scoping - the ec2:DescribeVolumes
                  #grant further down, scoped to snapshot/volume ARNs, is silently ineffective. Needs
                  #Resource: "*" here to actually work, same as every other Describe* action in this policy.
                  - ec2:DescribeVolumes
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:CreateSnapshot
                  - ec2:DeleteSnapshot
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                Resource:
                  - arn:aws:ec2:*::snapshot/*
                  - arn:aws:ec2:*:*:volume/*
              - Action:
                  - tag:GetResources
                Resource: "*"
                Effect: Allow
              - Effect: Allow
                Action:
                  - backup:DescribeBackupVault
                  - backup:CopyIntoBackupVault
                Resource: arn:aws:backup:*:*:backup-vault:*

  KmsKey:
      Type: AWS::KMS::Key
      Properties:
        Description: "Encryption key gaming server backups"
        EnableKeyRotation: True
        Enabled: True
        KeyPolicy:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                "AWS": { "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
              Action:
                - kms:*
              Resource: "*"

  BackupVault:
    Type: "AWS::Backup::BackupVault"
    Properties:
      BackupVaultName: !Sub "${AWS::StackName}-backup-vault-daily"
      EncryptionKeyArn: !GetAtt KmsKey.Arn

  BackupPlan:
    Type: "AWS::Backup::BackupPlan"
    Properties:
      BackupPlan:
        BackupPlanName: "backup-plan"
        BackupPlanRule:
          - RuleName: "daily-backups"
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: "cron(0 5 ? * * *)"
            Lifecycle:
              DeleteAfterDays: 7

  TagBasedBackupSelection:
    Type: "AWS::Backup::BackupSelection"
    Properties:
      BackupSelection:
        #Renamed (was "tag-based-backup-selection") only because BackupIamRole just gained a RoleName,
        #which forces IAM role replacement - and since this selection's IamRoleArn references that role,
        #CloudFormation tries to replace this resource too (create-new-before-delete-old), which AWS
        #Backup rejects if a selection with the same name already exists on the plan. A one-time rename
        #dodges that; RoleName is now fixed going forward, so this won't need to change again.
        SelectionName: "tag-based-backup-selection-v2"
        IamRoleArn: !GetAtt BackupIamRole.Arn
        #IdTagName/IdTagValue alone isn't enough to scope this to just this stack's own resources - that
        #tag pair is deliberately identical across every Server stack (it's how the Control Panel discovers
        #instances), so a selection matching only on it pulls in every other game's instance/volume too.
        #Both EC2Instance and GameDataVolume are also tagged with game-name, which is unique per stack -
        #ANDing on it here scopes each stack's vault to just its own resources.
        ListOfTags:
          - ConditionType: "STRINGEQUALS"
            ConditionKey: !Ref IdTagName
            ConditionValue: !Ref IdTagValue
          - ConditionType: "STRINGEQUALS"
            ConditionKey: "game-name"
            ConditionValue: !Ref GameName
      BackupPlanId: !Ref BackupPlan

  GetSrcIpsLambdaIamRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Description: Role for the EC2 Instance Connect source-IP custom resource lambda
      Path: /service-role/
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: 'arn:aws:logs:*:*:*'
          PolicyName: get-src-ips-inline

  GetSrcIpsLambda:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          import json
          from urllib.request import urlopen
          import cfnresponse
          def lambda_handler(event, context):
              if event['RequestType'] == 'Create':
                  try:
                      ip_ranges = urlopen('https://ip-ranges.amazonaws.com/ip-ranges.json')
                      ip_ranges = json.loads(ip_ranges.read())['prefixes']
                      ec2instanceconnect_ips = [item['ip_prefix'] for item in ip_ranges if item["service"] == "EC2_INSTANCE_CONNECT" and item["region"] == event['ResourceProperties']['region']]
                      ec2instanceconnect_ips = ec2instanceconnect_ips[0]
                      responseData = {'srcip': ec2instanceconnect_ips}
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
                  except Exception as e:
                      print(e)
                      cfnresponse.send(event, context, cfnresponse.FAILED, {'Response': 'Failed to get source IP for EC2 instance connect though I am perplexed as to why','srcip':'0.0.0.0/0'})
              else:
                cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Response': 'Update or Delete action not Supported.'})
      Description: Custom resource lambda to obtain source IP address range for EC2 Instance Connect in current region
      Role: !GetAtt GetSrcIpsLambdaIamRole.Arn
      Handler: index.lambda_handler
      Runtime: python3.8
      Timeout: 10

  GetInstanceConnectIps:
    Type: Custom::GetSourceIps
    Properties:
      ServiceToken: !GetAtt GetSrcIpsLambda.Arn
      region: !Ref AWS::Region

  SecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      Tags:
        - Key: Name
          Value: CF Gaming server Security Group
      GroupDescription: Enable HTTP access via port 80 locked down to the load balancer
      VpcId: !ImportValue common-infra-vpc-id

  SecurityGroupIngressTCP:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: hasTCP
    Properties:
      Description: Rule to allow gaming clients connect to your game server over TCP IPv4
      GroupId: !Ref SecurityGroup
      IpProtocol: TCP
      FromPort: !Ref GamingTCPTrafficPortStart
      ToPort: !Ref GamingTCPTrafficPortEnd
      CidrIp: 0.0.0.0/0

  SecurityGroupIngressUDP:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: hasUDP
    Properties:
      Description: Rule to allow gaming clients connect to your game server over UDP IPv4
      GroupId: !Ref SecurityGroup
      IpProtocol: UDP
      FromPort: !Ref GamingUDPTrafficPortStart
      ToPort: !Ref GamingUDPTrafficPortEnd
      CidrIp: 0.0.0.0/0

  SecurityGroupIngressEC2Connect:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Rule to allow EC2 Instance Connect to SSH into instance
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !GetAtt GetInstanceConnectIps.srcip

  IdleShutdownLambdaIamRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Description: Execution role for the per-server idle-detection auto-shutdown lambda
      Path: /service-role/
      Policies:
        - PolicyName: idle-shutdown-inline
          PolicyDocument:
            !Sub
              - |
                  {
                    "Version": "2012-10-17",
                    "Statement": [
                      {
                        "Effect": "Allow",
                        "Action": [
                          "logs:CreateLogGroup",
                          "logs:CreateLogStream",
                          "logs:PutLogEvents"
                        ],
                        "Resource": "arn:aws:logs:*:*:*"
                      },
                      {
                        "Effect": "Allow",
                        "Action": "ec2:DescribeInstances",
                        "Resource": "*"
                      },
                      {
                        "Effect": "Allow",
                        "Action": [
                          "ec2:StopInstances",
                          "ec2:CreateTags",
                          "ec2:DeleteTags"
                        ],
                        "Resource": "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*",
                        "Condition": {
                          "StringEquals": {
                            "ec2:ResourceTag/game-name": "${gameName}"
                          }
                        }
                      },
                      {
                        "Effect": "Allow",
                        "Action": "s3:GetObject",
                        "Resource": "arn:aws:s3:::${statusBucketName}/status/${gameName}.json"
                      }
                    ]
                  }
              - gameName: !Ref GameName
                statusBucketName: !ImportValue common-infra-status-bucket-name

  IdleShutdownLambda:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          import boto3
          import json
          def lambda_handler(event, context):
              ec2 = boto3.client('ec2')
              s3 = boto3.client('s3')
              gameName = event['gameName']
              response = ec2.describe_instances(Filters=[
                  {'Name': 'tag:game-name', 'Values': [gameName]},
                  {'Name': 'instance-state-name', 'Values': ['running']},
              ])
              for reservation in response['Reservations']:
                  for instance in reservation['Instances']:
                      instanceId = instance['InstanceId']
                      wasIdle = any(t['Key'] == 'idle-check' and t['Value'] == 'true' for t in instance.get('Tags', []))
                      try:
                          obj = s3.get_object(Bucket=event['statusBucket'], Key='status/'+gameName+'.json')
                          currentPlayers = json.loads(obj['Body'].read()).get('players', {}).get('current')
                      except Exception:
                          continue #no status reported yet (fresh install, or a game with no status agent) - can't tell if it's idle, leave it alone
                      isIdleNow = not currentPlayers #covers both 0 players and "can't determine" (e.g. game not running)
                      if isIdleNow and wasIdle:
                          ec2.stop_instances(InstanceIds=[instanceId])
                          #clear the tag on the stop itself, not just on the next start - otherwise a
                          #stopped instance still carries idle-check=true and the control panel shows
                          #"Idle - stopping soon" for a server that's already stopped.
                          ec2.delete_tags(Resources=[instanceId], Tags=[{'Key': 'idle-check', 'Value': 'true'}])
                      elif isIdleNow:
                          ec2.create_tags(Resources=[instanceId], Tags=[{'Key': 'idle-check', 'Value': 'true'}])
                      elif wasIdle:
                          ec2.delete_tags(Resources=[instanceId], Tags=[{'Key': 'idle-check', 'Value': 'true'}])
      Description: Stops this stack's own EC2 instance (found by its game-name tag) once it's had no players for two consecutive 15-minute checks
      Handler: index.lambda_handler
      Role: !GetAtt IdleShutdownLambdaIamRole.Arn
      Runtime: python3.8
      Timeout: 10

  IdleCheckSchedule:
    Type: AWS::Events::Rule
    Properties:
      #deterministic name (not CFN-generated) so the Control Panel's Lambda - in a different stack, with no
      #way to !GetAtt this rule - can address it by name to pause/resume/check it, same pattern already
      #used for BackupIamRole's RoleName.
      Name: !Sub "${AWS::StackName}-idle-check"
      Description: Checks every 15 minutes whether this server has had no players for two consecutive checks, and stops it if so
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        -   Arn: !GetAtt IdleShutdownLambda.Arn
            Id: IdleShutdownLambdaFunction
            Input: !Sub
              - '{"gameName": "${GameName}", "statusBucket": "${bucket}"}'
              - bucket: !ImportValue common-infra-status-bucket-name

  IdleShutdownLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IdleShutdownLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IdleCheckSchedule.Arn

Outputs:
  PublicIp:
    Description: This is the public IP for your gaming server, you will need to run a "start" command to associate your domain name with it (if you selected one)
    Condition: CreateInstance
    Value: !GetAtt EC2Instance.PublicIp

  InstanceId:
    Description: The EC2 instance ID for this game server
    Condition: CreateInstance
    Value: !Ref EC2Instance

  DataVolumeId:
    Description: The persistent EBS volume holding this server's world/mod data - survives instance replacement
    Value: !Ref GameDataVolume

  TagName:
    Description: Tag name used.  This should not have been changed, and should be game-server-finder
    Value: !Ref IdTagName

  TagValue:
    Description: Tag value selected to identify this server. Must match the value entered on your Control Panel stack.
    Value: !Ref IdTagValue
