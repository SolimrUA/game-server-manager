AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Personal Gaming Server Manager - Common networking infrastructure (VPC/Subnet/Internet Gateway).
  Deploy this stack once per account+region, before any Server or Control Panel stack.
  Its VpcId/SubnetId are exported under fixed names (CommonInfraVpcId/CommonInfraSubnetId) and
  imported by every Server stack - Fn::ImportValue only resolves within the same account+region, so
  this stack must live in the same account+region as the Server stacks that depend on it.

Resources:
  InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags:
        - Key: Name
          Value: CF Gamine Server IG

  RouteTable:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      Tags:
        - Key: Name
          Value: CF Gaming Server Route Table
      VpcId: !Ref VPC

  Route:
    Type: 'AWS::EC2::Route'
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref RouteTable

  Subnet:
    Type: 'AWS::EC2::Subnet'
    Properties:
      Tags:
        - Key: Name
          Value: CF Gaming Server Subnet
      CidrBlock: 10.0.0.0/24
      MapPublicIpOnLaunch: 'true'
      VpcId: !Ref VPC

  VPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      Tags:
        - Key: Name
          Value: Personal Gaming Server VPC
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: 'true'
      EnableDnsSupport: 'true'

  IgAttachment:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTblAttach:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref Subnet

Outputs:
  VpcId:
    Description: VPC ID - imported by every Server stack via Fn::ImportValue common-infra-vpc-id
    Value: !Ref VPC
    Export:
      Name: common-infra-vpc-id

  SubnetId:
    Description: Subnet ID - imported by every Server stack via Fn::ImportValue common-infra-subnet-id
    Value: !Ref Subnet
    Export:
      Name: common-infra-subnet-id
