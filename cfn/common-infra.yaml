AWSTemplateFormatVersion: 2010-09-09
Description: Personal Gaming Server Manager - shared VPC/networking infrastructure.

Resources:
  InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags:
        - Key: Name
          Value: CF Gamine Server IG

  RouteTable:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      Tags:
        - Key: Name
          Value: CF Gaming Server Route Table
      VpcId: !Ref VPC

  Route:
    Type: 'AWS::EC2::Route'
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref RouteTable

  Subnet:
    Type: 'AWS::EC2::Subnet'
    Properties:
      Tags:
        - Key: Name
          Value: CF Gaming Server Subnet
      CidrBlock: 10.0.0.0/24
      MapPublicIpOnLaunch: 'true'
      VpcId: !Ref VPC

  VPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      Tags:
        - Key: Name
          Value: Personal Gaming Server VPC
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: 'true'
      EnableDnsSupport: 'true'

  IgAttachment:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTblAttach:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref Subnet

  StatusBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: True
        BlockPublicPolicy: True
        IgnorePublicAcls: True
        RestrictPublicBuckets: True

Outputs:
  VpcId:
    Description: VPC ID - imported by every Server stack via Fn::ImportValue common-infra-vpc-id
    Value: !Ref VPC
    Export:
      Name: common-infra-vpc-id

  SubnetId:
    Description: Subnet ID - imported by every Server stack via Fn::ImportValue common-infra-subnet-id
    Value: !Ref Subnet
    Export:
      Name: common-infra-subnet-id

  SubnetAvailabilityZone:
    Description: >-
      AZ of the shared subnet - imported by every Server stack via Fn::ImportValue common-infra-subnet-az
      so each game's persistent data volume lands in the same AZ its EC2 instance does.
    Value: !GetAtt Subnet.AvailabilityZone
    Export:
      Name: common-infra-subnet-az

  StatusBucketName:
    Description: >-
      S3 bucket holding each server's live status snapshot (player count, mods, version - see docs/server-status.md).
      Every Server stack writes to it and the Control Panel reads from it, both via Fn::ImportValue common-infra-status-bucket-name.
    Value: !Ref StatusBucket
    Export:
      Name: common-infra-status-bucket-name
